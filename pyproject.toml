[project]
name = "sco"
version = "0.1.0"
description = "Supply Chain Ontology: BFO-aligned ontology, data pipelines, and reasoning tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.1",
    "owlrl>=7.1",
    "pyshacl>=0.30",
    "truststore>=0.10.4",
]

[project.scripts]
sco = "sco.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import data/

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
