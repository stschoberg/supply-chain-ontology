name: Publish research notebook

# Runs the research notebook and publishes it as a static page on GitHub Pages:
# https://stschoberg.github.io/supply-chain-ontology/
# Pull requests build the page, to check the notebook still exports, but don't deploy it.

on:
  push:
    branches: [main]
    paths:
      - research/**
      - src/sco/**
      - ontology/imports/**
      - ontology/src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - research/**
      - src/sco/**
      - ontology/imports/**
      - ontology/src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - name: Run the notebook and export it as HTML
        run: |
          mkdir -p site
          uv run marimo export html research/notebooks/stack-structure.py --output site/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
