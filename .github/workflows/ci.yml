name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ontology:
    name: Ontology (ROBOT + HermiT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: tools/robot.jar
          key: robot-${{ hashFiles('Makefile') }}
      - run: make reason
      - run: make report
      - run: make release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ontology-release
          path: ontology/release/
