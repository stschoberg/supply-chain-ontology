name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: make lint
      - run: make test

  ontology:
    name: Ontology (ROBOT + HermiT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: tools/robot.jar
          key: robot-${{ hashFiles('Makefile') }}
      - name: Components are up to date with templates
        run: |
          touch ontology/src/templates/*.tsv
          make components
          git diff --exit-code ontology/components/ || \
            (echo "::error::Run 'make components' and commit the result." && exit 1)
      - run: make reason
      - run: make report
      - run: make release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ontology-release
          path: ontology/release/
