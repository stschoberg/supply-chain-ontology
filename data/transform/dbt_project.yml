# Transforms raw source snapshots into tidy, tested tables in a local DuckDB warehouse.
# Run from the repo root with `make transform`, which passes the snapshot paths as vars.
name: sco_transform
version: "0.1.0"
profile: sco
config-version: 2

model-paths: [models]

models:
  sco_transform:
    staging:
      +materialized: view
    # Published models: exported to Parquet in each data release. Their columns are a contract.
    marts:
      +materialized: table
      +tags: [published]
    meta:
      +materialized: table
      +tags: [published]

flags:
  send_anonymous_usage_stats: false
