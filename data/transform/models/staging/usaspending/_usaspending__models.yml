version: 2

models:
  - name: stg_usaspending__awards
    description: >
      USAspending.gov contract award summaries as published, typed and renamed, one row per award:
      DoD purchases of bearings (PSC group 31) with any activity from FY2023 onward. An award is a
      contract or order with its modifications rolled up, deduplicated across fiscal-year files. It
      records a commitment to buy, not a delivery, and usually names a kind of part rather than a
      specific one.
    config:
      tags: [published]
      contract: {enforced: true}
    columns:
      - name: award_key
        description: USAspending's contract_award_unique_key. Stable across releases.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: piid
        description: Procurement instrument identifier (contract or order number).
        data_type: varchar
      - name: parent_piid
        description: Parent contract (IDV) for orders; null for standalone contracts.
        data_type: varchar
      - name: recipient_uei
        description: Supplier's SAM.gov Unique Entity ID. Use this, not the name, to identify suppliers.
        data_type: varchar
        data_tests:
          - not_null:
              config: {severity: warn}
          - relationships:
              arguments: {to: ref('entities'), field: uei}
      - name: recipient_name
        description: Supplier name as reported; spelling varies across awards.
        data_type: varchar
        data_tests: [not_null]
      - name: recipient_parent_uei
        description: UEI of the supplier's corporate parent.
        data_type: varchar
        data_tests:
          - relationships:
              arguments: {to: ref('entities'), field: uei}
      - name: recipient_parent_name
        description: Name of the supplier's corporate parent.
        data_type: varchar
      - name: cage_code
        description: Commercial and Government Entity code of the supplier.
        data_type: varchar
      - name: domestic_or_foreign_entity
        description: Ownership category, e.g. "U.S. OWNED BUSINESS", "FOREIGN-OWNED BUSINESS INCORPORATED IN THE U.S.".
        data_type: varchar
      - name: recipient_is_manufacturer
        description: Whether the contracting officer determined the supplier manufactures the goods. False for distributors and agents.
        data_type: boolean
      - name: recipient_city
        description: City of the supplier's address.
        data_type: varchar
      - name: recipient_state
        description: Two-letter state of the supplier's address; null outside the U.S.
        data_type: varchar
      - name: recipient_zip
        description: ZIP+4 (9 digits) or foreign postal code of the supplier's address.
        data_type: varchar
      - name: recipient_country
        description: Country of the supplier's address.
        data_type: varchar
      - name: origin_country
        description: Country of origin of the product.
        data_type: varchar
      - name: place_of_manufacture
        description: Whether the product is made in the U.S. and, if not, the exception that allows it, e.g. "MFG IN U.S.", "MFG OUTSIDE U.S. - TRADE AGREEMENTS".
        data_type: varchar
      - name: place_of_performance_city
        description: City of the principal place where the work is done. For goods, usually where they are made or shipped from, not where they are delivered.
        data_type: varchar
      - name: place_of_performance_state
        description: Two-letter state of the place of performance; null outside the U.S.
        data_type: varchar
      - name: place_of_performance_zip
        description: ZIP+4 (9 digits) of the place of performance.
        data_type: varchar
      - name: place_of_performance_country
        description: Country of the place of performance.
        data_type: varchar
      - name: psc
        description: Product and Service Code; 3110, 3120, or 3130.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: {values: ['3110', '3120', '3130']}
      - name: item_name
        description: Item name from the description, without DLA's leading reference number. Truncated, inconsistent spelling.
        data_type: varchar
      - name: nsn
        description: National Stock Number (13 digits) when the description contains one; under 1% of awards.
        data_type: varchar
      - name: description
        description: Original free-text description.
        data_type: varchar
      - name: dla_reference_number
        description: Leading 10-digit number in DLA descriptions. Unique per award; NOT an item identifier.
        data_type: varchar
        data_tests: [unique]
      - name: awarding_sub_agency
        description: DoD component that made the award; mostly the Defense Logistics Agency.
        data_type: varchar
      - name: total_obligated_amount
        description: Total dollars obligated, USD.
        data_type: decimal(18,2)
      - name: base_action_date
        description: Date of the award's first action.
        data_type: date
      - name: solicitation_date
        description: Date the purchase was put out for offers; reported on about half of awards.
        data_type: date
      - name: performance_start_date
        description: Start of the period of performance, the window the contract gives for the work or delivery.
        data_type: date
      - name: performance_end_date
        description: Current end of the period of performance, after any modifications. A contracted date, not a record that goods arrived.
        data_type: date
      - name: extent_competed
        description: Competition category, e.g. "FULL AND OPEN COMPETITION", "NOT COMPETED".
        data_type: varchar
      - name: offers_received
        description: Number of offers received. 1 suggests a sole source; null when not reported.
        data_type: integer
      - name: other_than_full_and_open_reason
        description: Legal justification when the award was not fully competed.
        data_type: varchar
      - name: last_modified_at
        description: When USAspending last changed the award; the newest version wins when files overlap.
        data_type: timestamp
      - name: source_file
        description: Raw file the row came from (`<fiscal-year folder>/<csv>`), within the release's raw archive.
        data_type: varchar
