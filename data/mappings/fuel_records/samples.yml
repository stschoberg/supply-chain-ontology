# fuel_records samples in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [samples.csv~csv]

mappings:
  samples:
    sources: rows
    s: d:synthetic/fuel/sample/$(sample_number)
    po:
      - [a, fuel_records:Sample]
      - [fuel_records:sampleNumber, $(sample_number)]
      - [fuel_records:dfsp, d:synthetic/fuel/activity/$(dfsp)~iri]
      - [fuel_records:location, d:synthetic/fuel/tank/$(dfsp)/$(location)~iri]
      - [fuel_records:sampleType, $(sample_type)]
      - [fuel_records:sampleDate, $(sample_date), xsd:date]
      - [fuel_records:takenBy, d:synthetic/fuel/person/$(taken_by)~iri]
      - [fuel_records:reason, $(reason)]
      - [fuel_records:grade, $(grade)]
      - [fuel_records:specification, $(specification)]
      - [fuel_records:gallonsRepresented, $(gallons_represented), xsd:integer]
      - [fuel_records:laboratory, d:synthetic/fuel/activity/$(laboratory)~iri]
      - [fuel_records:labReport, $(lab_report)]
      - [fuel_records:status, $(status)]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
