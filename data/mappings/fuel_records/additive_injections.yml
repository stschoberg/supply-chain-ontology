# fuel_records additive_injections in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [additive_injections.csv~csv]

mappings:
  additive_injections:
    sources: rows
    s: d:synthetic/fuel/additive-injection/$(injection)
    po:
      - [a, fuel_records:AdditiveInjection]
      - [fuel_records:injection, $(injection)]
      - [fuel_records:dfsp, d:synthetic/fuel/activity/$(dfsp)~iri]
      - [fuel_records:tank, d:synthetic/fuel/tank/$(dfsp)/$(tank)~iri]
      - [fuel_records:additive, $(additive)]
      - [fuel_records:additiveGallons, $(additive_gallons), xsd:integer]
      - [fuel_records:targetVolPct, $(target_vol_pct), xsd:decimal]
      - [fuel_records:fuelNetGallons, $(fuel_net_gallons), xsd:integer]
      - [fuel_records:injectionDate, $(injection_date), xsd:date]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
