# fuel_records ledger_transactions in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [ledger_transactions.csv~csv]

mappings:
  ledger_transactions:
    sources: rows
    s: d:synthetic/fuel/ledger/$(entry)
    po:
      - [a, fuel_records:LedgerEntry]
      - [fuel_records:entry, $(entry)]
      - [fuel_records:dfsp, d:synthetic/fuel/activity/$(dfsp)~iri]
      - [fuel_records:grade, $(grade)]
      - [fuel_records:transactionDate, $(transaction_date), xsd:date]
      - [fuel_records:type, $(type)]
      - [fuel_records:gallons, $(gallons), xsd:integer]
      - [fuel_records:document, $(document)]
      - [fuel_records:reverses, d:synthetic/fuel/ledger/$(reverses)~iri]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
