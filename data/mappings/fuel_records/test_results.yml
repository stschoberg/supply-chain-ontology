# fuel_records test_results in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [test_results.csv~csv]

mappings:
  test_results:
    sources: rows
    s: d:synthetic/fuel/test-result/$(sample_number)/$(property)
    po:
      - [a, fuel_records:TestResult]
      - [fuel_records:sample, d:synthetic/fuel/sample/$(sample_number)~iri]
      - [fuel_records:testType, $(test_type)]
      - [fuel_records:property, $(property)]
      - [fuel_records:value, $(value)]
      - [fuel_records:unit, $(unit)]
      - [fuel_records:specMin, $(spec_min), xsd:decimal]
      - [fuel_records:specMax, $(spec_max), xsd:decimal]
      - [fuel_records:receiptMin, $(receipt_min), xsd:decimal]
      - [fuel_records:receiptMax, $(receipt_max), xsd:decimal]
      - [fuel_records:meetsSpec, $(meets_spec), xsd:boolean]
      - [fuel_records:meetsReceiptLimit, $(meets_receipt_limit), xsd:boolean]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
