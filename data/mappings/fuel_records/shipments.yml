# fuel_records shipments in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [shipments.csv~csv]

mappings:
  shipments:
    sources: rows
    s: d:synthetic/fuel/shipment/$(document_number)
    po:
      - [a, fuel_records:Shipment]
      - [fuel_records:documentNumber, $(document_number)]
      - [fuel_records:form, $(form)]
      - [fuel_records:orderNumber, $(order_number)]
      - [fuel_records:stoNumber, $(sto_number)]
      - [fuel_records:grade, $(grade)]
      - [fuel_records:grossGallons, $(gross_gallons), xsd:integer]
      - [fuel_records:netGallons, $(net_gallons), xsd:integer]
      - [fuel_records:temperatureF, $(temperature_f), xsd:decimal]
      - [fuel_records:apiGravity, $(api_gravity), xsd:decimal]
      - [fuel_records:determinationMethod, $(determination_method)]
      - [fuel_records:shipFrom, d:synthetic/fuel/activity/$(ship_from)~iri]
      - [fuel_records:shipFromTank, d:synthetic/fuel/tank/$(ship_from)/$(ship_from_tank)~iri]
      - [fuel_records:shipTo, d:synthetic/fuel/activity/$(ship_to)~iri]
      - [fuel_records:mode, $(mode)]
      - [fuel_records:batchOrCargo, $(batch_or_cargo)]
      - [fuel_records:certificate, d:synthetic/fuel/certificate/$(certificate)~iri]
      - [fuel_records:seals, $(seals)]
      - [fuel_records:shipDate, $(ship_date), xsd:date]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
