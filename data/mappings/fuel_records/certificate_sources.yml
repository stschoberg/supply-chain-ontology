# fuel_records certificate_sources in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [certificate_sources.csv~csv]

mappings:
  certificate_sources:
    sources: rows
    s: d:synthetic/fuel/certificate/$(certificate)/source/$(source_batch)
    po:
      - [a, fuel_records:CertificateSource]
      - [fuel_records:certificate, d:synthetic/fuel/certificate/$(certificate)~iri]
      - [fuel_records:sourceBatch, $(source_batch)]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
