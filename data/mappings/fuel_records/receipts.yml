# fuel_records receipts in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [receipts.csv~csv]

mappings:
  receipts:
    sources: rows
    s: d:synthetic/fuel/receipt/$(receipt)
    po:
      - [a, fuel_records:Receipt]
      - [fuel_records:receipt, $(receipt)]
      - [fuel_records:shipment, d:synthetic/fuel/shipment/$(shipment)~iri]
      - [fuel_records:dfsp, d:synthetic/fuel/activity/$(dfsp)~iri]
      - [fuel_records:tank, d:synthetic/fuel/tank/$(dfsp)/$(tank)~iri]
      - [fuel_records:determinationMethod, $(determination_method)]
      - [fuel_records:openingNetGallons, $(opening_net_gallons), xsd:integer]
      - [fuel_records:closingNetGallons, $(closing_net_gallons), xsd:integer]
      - [fuel_records:temperatureF, $(temperature_f), xsd:decimal]
      - [fuel_records:apiGravity, $(api_gravity), xsd:decimal]
      - [fuel_records:grossGallons, $(gross_gallons), xsd:integer]
      - [fuel_records:netGallons, $(net_gallons), xsd:integer]
      - [fuel_records:variancePct, $(variance_pct), xsd:decimal]
      - [fuel_records:receiptDate, $(receipt_date), xsd:date]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
