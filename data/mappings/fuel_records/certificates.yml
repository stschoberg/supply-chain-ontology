# fuel_records certificates in the source's own terms (layer 1 of ADR-0005): YARRRML, run by
# `make lift-examples`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/fuel/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  fuel_records: https://w3id.org/sco/source/fuel_records/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [certificates.csv~csv]

mappings:
  certificates:
    sources: rows
    s: d:synthetic/fuel/certificate/$(certificate)
    po:
      - [a, fuel_records:Certificate]
      - [fuel_records:certificateNumber, $(certificate)]
      - [fuel_records:kind, $(kind)]
      - [fuel_records:batchNumber, $(batch_number)]
      - [fuel_records:issuer, d:synthetic/fuel/activity/$(issuer)~iri]
      - [fuel_records:issueDate, $(issue_date), xsd:date]
      - [fuel_records:sample, d:synthetic/fuel/sample/$(sample)~iri]
      - [fuel_records:follows, $(follows)]
      - [fuel_records:synthetic, $(synthetic), xsd:boolean]
