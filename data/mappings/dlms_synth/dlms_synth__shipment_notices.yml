# dlms_synth__shipment_notices in the source's own terms (layer 1 of ADR-0005): YARRRML, run by `make lift`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  dlms_synth: https://w3id.org/sco/source/dlms_synth/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [dlms_synth__shipment_notices.csv~csv]

mappings:
  shipmentNotices:
    sources: rows
    s: d:synthetic/shipment/$(tcn)
    po:
      - [a, dlms_synth:ShipmentNotice]
      - [dlms_synth:tcn, $(tcn)]
      - [dlms_synth:award, d:award/$(award_key)~iri]  # the real award's node, in the usaspending graph
      - [dlms_synth:piid, $(piid)]
      - [dlms_synth:clin, $(clin)]
      - [dlms_synth:shipmentNumber, $(shipment_number), xsd:integer]
      - [dlms_synth:supplierCage, $(supplier_cage)]
      - [dlms_synth:shipFromCity, $(ship_from_city)]
      - [dlms_synth:shipFromCountry, $(ship_from_country)]
      - [dlms_synth:shipToActivity, d:synthetic/activity/$(ship_to_activity)~iri]  # foreign key to activities
      - [dlms_synth:quantityShipped, $(quantity_shipped), xsd:integer]
      - [dlms_synth:shipDate, $(ship_date), xsd:date]
      - [dlms_synth:acceptancePoint, $(acceptance_point)]
      - [dlms_synth:synthetic, $(synthetic), xsd:boolean]
