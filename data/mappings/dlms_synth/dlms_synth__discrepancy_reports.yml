# dlms_synth__discrepancy_reports in the source's own terms (layer 1 of ADR-0005): YARRRML, run by `make lift`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  dlms_synth: https://w3id.org/sco/source/dlms_synth/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [dlms_synth__discrepancy_reports.csv~csv]

mappings:
  discrepancyReports:
    sources: rows
    s: d:synthetic/discrepancy-report/$(tcn)
    po:
      - [a, dlms_synth:DiscrepancyReport]
      - [dlms_synth:shipment, d:synthetic/shipment/$(tcn)~iri]  # foreign key to shipment_notices
      - [dlms_synth:award, d:award/$(award_key)~iri]  # the real award's node, in the usaspending graph
      - [dlms_synth:piid, $(piid)]
      - [dlms_synth:clin, $(clin)]
      - [dlms_synth:reportingActivity, d:synthetic/activity/$(reporting_activity)~iri]  # foreign key to activities
      - [dlms_synth:reportDate, $(report_date), xsd:date]
      - [dlms_synth:discrepancy, $(discrepancy)]
      - [dlms_synth:quantityShipped, $(quantity_shipped), xsd:integer]
      - [dlms_synth:quantityReceived, $(quantity_received), xsd:integer]
      - [dlms_synth:synthetic, $(synthetic), xsd:boolean]
