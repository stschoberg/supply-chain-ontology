# dlms_synth__requisitions in the source's own terms (layer 1 of ADR-0005): YARRRML, run by `make lift`.
#
# SYNTHETIC: every node this makes is invented, and lives under d:synthetic/. Mechanical, like every
# layer 1 mapping: a row is a node, every column is one property, a foreign key is a link.

prefixes:
  dlms_synth: https://w3id.org/sco/source/dlms_synth/
  d: https://w3id.org/sco/data/
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  rows: [dlms_synth__requisitions.csv~csv]

mappings:
  requisitions:
    sources: rows
    s: d:synthetic/requisition/$(document_number)
    po:
      - [a, dlms_synth:Requisition]
      - [dlms_synth:documentNumber, $(document_number)]
      - [dlms_synth:nsn, $(nsn)]
      - [dlms_synth:psc, $(psc)]
      - [dlms_synth:unitOfIssue, $(unit_of_issue)]
      - [dlms_synth:requisitioner, d:synthetic/activity/$(requisitioner)~iri]  # foreign key to activities
      - [dlms_synth:quantityRequisitioned, $(quantity_requisitioned), xsd:integer]
      - [dlms_synth:requisitionDate, $(requisition_date), xsd:date]
      - [dlms_synth:priority, $(priority)]
      - [dlms_synth:synthetic, $(synthetic), xsd:boolean]
